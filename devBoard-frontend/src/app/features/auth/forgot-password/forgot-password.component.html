<div class="auth-page">
  <div class="auth-card">
    <h1>Recuperar senha</h1>

    <ng-container *ngIf="!submitted; else confirmation">
      <p>Informe seu email. Se ele existir em nossa base, enviaremos um link para redefinir a senha.</p>

      <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" autocomplete="email" />
          <div class="field-error" *ngIf="f['email'].invalid && f['email'].touched">
            <span *ngIf="f['email'].errors?.['required']">Email é obrigatório</span>
            <span *ngIf="f['email'].errors?.['email']">Email inválido</span>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Enviando...' : 'Enviar link de recuperação' }}
        </button>
      </form>
    </ng-container>

    <ng-template #confirmation>
      <div class="alert alert-success">
        Se o email existir em nossa base, você receberá as instruções de recuperação em instantes.
      </div>
    </ng-template>

    <p class="switch-link"><a routerLink="/login">Voltar ao login</a></p>
  </div>
</div>
