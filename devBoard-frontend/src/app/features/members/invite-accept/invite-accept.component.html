<div class="auth-page"><div class="auth-card"><ng-container *ngIf="invite; else state"><p class="eyebrow">CONVITE PARA PROJETO</p><h1>{{ invite.projectName }}</h1><p>{{ invite.inviterName }} convidou você como {{ invite.role }}.</p><button type="button" (click)="accept()" [disabled]="isAccepting">{{ isAccepting ? 'Aceitando...' : 'Aceitar convite' }}</button></ng-container><ng-template #state><p *ngIf="!errorMessage">Validando convite...</p><div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div><a routerLink="/login" *ngIf="errorMessage">Voltar ao login</a></ng-template></div></div>
